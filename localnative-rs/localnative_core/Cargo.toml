[package]
name = "localnative_core"
description = "localnative core lib"
homepage = "https://localnative.app"
authors = ["Yi Wang"]
version.workspace = true
license = "AGPL-3.0"
edition = "2024"

[target.'cfg(target_os="android")'.dependencies]
jni = { workspace = true, default-features = false }

[dependencies]
linked_hash_set = { workspace = true }
regex = { workspace = true }
time = { workspace = true, features = ["formatting", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
dirs = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
semver = { workspace = true }
tokio = { workspace = true, features = ["full"] }
bincode = { workspace = true }
getrandom = { workspace = true }
if-addrs = { workspace = true }
snow = { workspace = true }
blake2 = { workspace = true }
anyhow = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
rusqlite = { workspace = true }
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }
chrono = { workspace = true, default-features = false, features = ["serde"] }
tracing = { workspace = true }
mdns-sd = { workspace = true }
hostname = { workspace = true }

[lib]
name = "localnative_core"
crate-type = ["rlib", "cdylib", "staticlib"]


[features]
default = []
# Encrypt the database at rest with SQLCipher. Swaps the bundled SQLite for the
# bundled SQLCipher build (CommonCrypto on Apple targets, OpenSSL's libcrypto
# elsewhere — install libssl-dev on Debian/Ubuntu).
encryption = ["rusqlite/bundled-sqlcipher"]
