[package]
name = "localnative_cli"
description = "Local-first text archive, note search, sync, browser host, and MCP command line utility"
homepage = "https://localnative.app"
repository = "https://github.com/localnative/localnative"
keywords = ["local-first", "notes", "archive", "mcp", "sync"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
authors = ["Yi Wang"]
license = "AGPL-3.0"
edition = "2024"
default-run = "localnative"

[[bin]]
name = "localnative"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["cargo"] }
localnative_core = { version = "0.8.0", path = "../localnative_core" }
localnative_hostinstall = { version = "0.8.0", path = "../localnative_hostinstall" }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
