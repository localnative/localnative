[workspace]
members = [
    "localnative_core",
    "localnative_cli",
    "localnative_hostinstall",
    "xtask",
]
resolver = "2"

# Shared release version for the Rust crates. These ship together, so they
# carry one number; every other platform versions independently -- see
# docs/VERSIONING.md.
[workspace.package]
version = "0.8.0"

[workspace.dependencies]
anyhow = "1.0"
xshell = "0.2"
xflags = "0.3"
clap = { version = "4", features = ["cargo"] }
rusqlite = { version = "0.40", features = ["bundled"] }
# SQLCipher is opt-in per build: `cargo build -p localnative_core --features encryption`
# switches the bundled SQLite to SQLCipher (see localnative_core/Cargo.toml).
r2d2 = "0.8"
r2d2_sqlite = "0.35"
linked_hash_set = "0.1"
regex = "1.12"
time = { version = "0.3", features = ["formatting", "macros", "serde-human-readable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
semver = "1"
tokio = { version = "1", features = ["full"] }
bincode = "1.3"
getrandom = "0.4"
if-addrs = "0.15"
snow = "0.10"
blake2 = "0.10"
thiserror = "2.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
winreg = "0.56"
jni = { version = "0.22", default-features = false }
hex = "0.4"
tracing = "0.1"
tokio-util = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mdns-sd = "0.21"
hostname = "0.4"
