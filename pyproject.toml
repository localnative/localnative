[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "localnative"
dynamic = ["version"]
description = "Search, archive, sync, and provide read-only MCP access to your local LocalNative library"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Yi Wang" }]
keywords = ["local-first", "notes", "archive", "mcp", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://localnative.app"
Source = "https://github.com/localnative/localnative"
Issues = "https://github.com/localnative/localnative/issues"

[tool.maturin]
bindings = "bin"
manifest-path = "localnative-rs/localnative_cli/Cargo.toml"
compatibility = "pypi"
targets = [
    { name = "localnative", kind = "bin" },
    { name = "localnative-web-ext-host", kind = "bin" },
]
