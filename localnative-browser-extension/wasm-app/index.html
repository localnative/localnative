<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link data-trunk rel="copy-file" href="manifest.json" />
        <link data-trunk rel="copy-file" href="icon.png" />
        <link data-trunk rel="copy-file" href="init.js" />
        <link data-trunk rel="copy-file" href="content_script.js" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
        />
        <title>Local Native</title>
        <style>
            :root {
                --primary: #4f46e5;
                --primary-hover: #4338ca;
                --bg-main: #f8fafc;
                --bg-card: #ffffff;
                --bg-card-hover: #f1f5f9;
                --text-primary: #1e293b;
                --text-secondary: #64748b;
                --text-muted: #94a3b8;
                --border: #e2e8f0;
                --border-focus: #4f46e5;
                --danger: #ef4444;
                --danger-hover: #dc2626;
                --tag-bg: #e0e7ff;
                --tag-text: #3730a3;
                --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
                --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
                --radius: 8px;
                --radius-lg: 12px;
            }

            .dark-theme {
                --primary: #818cf8;
                --primary-hover: #a5b4fc;
                --bg-main: #0f172a;
                --bg-card: #1e293b;
                --bg-card-hover: #334155;
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --text-muted: #64748b;
                --border: #334155;
                --border-focus: #818cf8;
                --danger: #f87171;
                --danger-hover: #ef4444;
                --tag-bg: #312e81;
                --tag-text: #c7d2fe;
                --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
                --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html,
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
                background-color: var(--bg-main);
                color: var(--text-primary);
                font-size: 14px;
                line-height: 1.5;
                transition: background-color 0.3s ease, color 0.3s ease;
            }

            .app-container {
                background-color: var(--bg-main);
                padding: 16px;
                min-width: 628px;
                max-width: 768px;
                margin: 0 auto;
            }

            /* Header */
            .header-section {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding-bottom: 12px;
                margin-bottom: 16px;
                border-bottom: 1px solid var(--border);
            }

            .app-title {
                font-size: 18px;
                font-weight: 600;
                color: var(--primary);
                margin: 0;
                text-decoration: none;
                transition: color 0.2s;
            }

            .app-title:hover {
                color: var(--primary-hover);
            }

            .theme-toggle {
                background: none;
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 8px 12px;
                cursor: pointer;
                font-size: 16px;
                color: var(--text-secondary);
                transition: all 0.2s;
            }

            .theme-toggle:hover {
                background: var(--bg-card-hover);
                border-color: var(--border-focus);
            }

            .toggle-container {
                display: flex;
                align-items: center;
                gap: 6px;
            }

            .toggle-input {
                width: 16px;
                height: 16px;
                accent-color: var(--primary);
                cursor: pointer;
            }

            .toggle-label {
                font-size: 13px;
                color: var(--text-secondary);
                cursor: pointer;
            }

            .language-container {
                display: flex;
                align-items: center;
                gap: 6px;
            }

            .select-label {
                font-size: 13px;
                color: var(--text-secondary);
            }

            .language-select {
                padding: 6px 10px;
                border-radius: var(--radius);
                background-color: var(--bg-card);
                color: var(--text-primary);
                border: 1px solid var(--border);
                font-size: 13px;
                cursor: pointer;
                outline: none;
                transition: border-color 0.2s;
            }

            .language-select:focus {
                border-color: var(--border-focus);
            }

            /* Input section */
            .input-section {
                display: flex;
                flex-direction: column;
                gap: 8px;
                margin-bottom: 16px;
            }

            .input-row {
                display: flex;
                gap: 8px;
            }

            .text-input,
            .textarea-input {
                flex: 1;
                padding: 10px 14px;
                border: 1px solid var(--border);
                border-radius: var(--radius);
                font-size: 14px;
                background-color: var(--bg-card);
                color: var(--text-primary);
                transition: border-color 0.2s, box-shadow 0.2s;
            }

            .text-input:focus,
            .textarea-input:focus {
                outline: none;
                border-color: var(--border-focus);
                box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
            }

            .text-input::placeholder,
            .textarea-input::placeholder {
                color: var(--text-muted);
            }

            .textarea-input {
                resize: vertical;
                min-height: 60px;
            }

            .insert-btn {
                padding: 10px 20px;
                background-color: var(--primary);
                color: white;
                border: none;
                border-radius: var(--radius);
                cursor: pointer;
                font-weight: 500;
                font-size: 14px;
                transition: background-color 0.2s, transform 0.2s;
            }

            .insert-btn:hover {
                background-color: var(--primary-hover);
                transform: translateY(-1px);
            }

            /* Search section */
            .search-section {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
                margin-bottom: 16px;
            }

            .search-input-container {
                display: flex;
                flex-grow: 1;
                gap: 8px;
            }

            .clear-btn,
            .nav-btn {
                background: var(--bg-card);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 8px 12px;
                cursor: pointer;
                font-size: 14px;
                color: var(--text-secondary);
                transition: all 0.2s;
            }

            .clear-btn:hover,
            .nav-btn:hover {
                background: var(--bg-card-hover);
                border-color: #cbd5e1;
            }

            .page-indicator {
                color: var(--text-secondary);
                font-size: 13px;
                font-variant-numeric: tabular-nums;
                min-width: 70px;
                text-align: center;
            }

            .search-nav-container {
                display: flex;
                align-items: center;
                gap: 8px;
            }

            /* Notes */
            .notes-container {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .note {
                background: var(--bg-card);
                border-radius: var(--radius-lg);
                padding: 14px 16px;
                border: 1px solid var(--border);
                transition: box-shadow 0.2s, border-color 0.2s;
            }

            .note:hover {
                box-shadow: var(--shadow-md);
                border-color: #cbd5e1;
            }

            .note-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 8px;
            }

            .note-date {
                font-size: 12px;
                color: var(--text-muted);
            }

            .delete-btn {
                background: transparent;
                border: 1px solid var(--danger);
                border-radius: 4px;
                padding: 4px 10px;
                color: var(--danger);
                cursor: pointer;
                font-size: 12px;
                transition: all 0.2s;
            }

            .delete-btn:hover {
                background: var(--danger);
                color: white;
            }

            .note-title {
                font-size: 14px;
                font-weight: 600;
                color: var(--text-primary);
                margin: 0 0 4px 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                cursor: pointer;
            }

            .note-url {
                color: var(--primary);
                text-decoration: none;
                display: block;
                margin-bottom: 6px;
                font-size: 12px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                transition: text-decoration 0.2s;
            }

            .note-url:hover {
                text-decoration: underline;
            }

            .note-desc {
                white-space: pre-wrap;
                font-size: 13px;
                color: var(--text-secondary);
                margin-bottom: 8px;
            }

            .expand-text {
                color: var(--primary);
                cursor: pointer;
                font-size: 12px;
                margin-left: 4px;
            }

            .expand-text:hover {
                text-decoration: underline;
            }

            .note-tags {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
            }

            .tag-btn {
                background-color: var(--tag-bg);
                color: var(--tag-text);
                border: none;
                border-radius: 4px;
                padding: 2px 8px;
                font-size: 11px;
                cursor: pointer;
                transition: background-color 0.2s;
            }

            .tag-btn:hover {
                background-color: #c7d2fe;
            }

            .dark-theme .tag-btn:hover {
                background-color: #4338ca;
            }

            /* Response section */
            .response-section {
                font-size: 11px;
                color: var(--text-muted);
                margin-top: 16px;
                padding: 8px 12px;
                background-color: var(--bg-card);
                border-radius: var(--radius);
                border: 1px solid var(--border);
            }

            .none {
                display: none;
            }

            /* Scrollbar */
            ::-webkit-scrollbar {
                width: 8px;
            }

            ::-webkit-scrollbar-track {
                background: var(--bg-main);
            }

            ::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 4px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: #cbd5e1;
            }

            @media (max-width: 768px) {
                body {
                    padding: 0;
                }

                .app-container {
                    padding: 12px;
                }

                .input-row {
                    flex-direction: column;
                }
            }
        </style>
    </head>
    <body></body>
</html>
