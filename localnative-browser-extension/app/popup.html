<!DOCTYPE html>

<html>
  <head>
    <script src='./sanitizer.js'></script>
    <script src='./i18n.js'></script>
    <script src='./locales/zh-CN.js'></script>
    <script src='./locales/en-US.js'></script>
    <script src='./popup.js'></script><script src='./popup-i18n.js'></script>
    <style>
      :root {
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --bg-main: #f8fafc;
        --bg-card: #ffffff;
        --bg-card-hover: #f1f5f9;
        --text-primary: #1e293b;
        --text-secondary: #64748b;
        --text-muted: #94a3b8;
        --border: #e2e8f0;
        --border-focus: #4f46e5;
        --danger: #ef4444;
        --danger-hover: #dc2626;
        --tag-bg: #e0e7ff;
        --tag-text: #3730a3;
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
        --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
        --radius: 8px;
        --radius-lg: 12px;
      }

      .dark-theme {
        --primary: #818cf8;
        --primary-hover: #a5b4fc;
        --bg-main: #0f172a;
        --bg-card: #1e293b;
        --bg-card-hover: #334155;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --border: #334155;
        --border-focus: #818cf8;
        --danger: #f87171;
        --danger-hover: #ef4444;
        --tag-bg: #312e81;
        --tag-text: #c7d2fe;
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
        --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: var(--bg-main);
        color: var(--text-primary);
        min-width: 700px;
        max-width: 700px;
        /* Chrome caps popups at 600px tall. Fixing the height (border-box, so
           padding is included) keeps the header and search bar pinned while
           #notes scrolls, instead of the whole popup scrolling the search box
           out of view. */
        height: 580px;
        display: flex;
        flex-direction: column;
        padding: 10px;
        line-height: 1.5;
      }

      /* Header */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 6px;
        margin-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .header a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
        font-size: 16px;
      }

      .header a:hover {
        color: var(--primary-hover);
      }

      .version {
        color: var(--text-muted);
        font-size: 12px;
      }

      .theme-toggle {
        background: none;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 6px 10px;
        cursor: pointer;
        font-size: 16px;
        color: var(--text-secondary);
        transition: all 0.2s;
      }

      .theme-toggle:hover {
        background: var(--bg-card-hover);
        border-color: var(--border-focus);
      }

      .header-options {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .checkbox-label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--text-secondary);
        cursor: pointer;
      }

      .checkbox-label input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: var(--primary);
        cursor: pointer;
      }

      /* Language select */
      .lang-select {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--text-secondary);
      }

      .lang-select select {
        padding: 4px 8px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg-card);
        color: var(--text-primary);
        font-size: 13px;
        cursor: pointer;
        outline: none;
      }

      /* the popup list is drawn by the platform on Windows/Linux and does not
         inherit the select's colours */
      .lang-select select option {
        background: var(--bg-card);
        color: var(--text-primary);
      }

      .lang-select select:focus {
        border-color: var(--border-focus);
      }

      /* Input fields */
      .input-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 8px;
      }

      /* Description and Tags are both short; stacking them wastes a full row */
      .input-row {
        display: flex;
        gap: 6px;
      }

      .input-row .save-input {
        flex: 1 1 0;
        min-width: 0;
      }

      .save-input {
        width: 100%;
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-size: 13px;
        background: var(--bg-card);
        color: var(--text-primary);
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .save-input:focus {
        outline: none;
        border-color: var(--border-focus);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
      }

      .save-input::placeholder,
      #search-text::placeholder {
        color: var(--text-muted);
      }

      /* Search bar */
      .search-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }

      #search-text {
        flex: 1;
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-size: 14px;
        background: var(--bg-card);
        color: var(--text-primary);
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      #search-text:focus {
        outline: none;
        border-color: var(--border-focus);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
      }

      .btn {
        padding: 8px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        background: var(--bg-card);
        color: var(--text-secondary);
        transition: all 0.2s;
      }

      .btn:hover {
        background: var(--bg-card-hover);
        border-color: #cbd5e1;
      }

      .btn-clear {
        padding: 8px 12px;
        font-weight: 600;
      }

      .pagination {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #indicator {
        font-size: 13px;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
      }

      /* Notes list */
      #notes {
        display: flex;
        flex-direction: column;
        gap: 0;
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        border-top: 1px solid var(--border);
      }

      .note {
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--border);
        border-radius: 0;
        padding: 7px 8px;
        transition: background 0.15s;
      }

      /* line 1: title, tags, delete -- line 2: ids, url, date, description */
      .note-line {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      .note-sub {
        display: flex;
        align-items: baseline;
        gap: 6px;
        margin-top: 2px;
        font-size: 11px;
        color: var(--text-muted);
        white-space: nowrap;
      }

      .note-id {
        flex: 0 0 auto;
        font-variant-numeric: tabular-nums;
      }

      .note:hover {
        background: var(--bg-card);
      }

      .note-tags {
        display: flex;
        gap: 4px;
        flex: 0 0 auto;
      }

      .tag-btn {
        padding: 1px 6px;
        background: var(--tag-bg);
        color: var(--tag-text);
        border: none;
        border-radius: 4px;
        font-size: 10px;
        cursor: pointer;
        transition: background 0.2s;
      }

      .tag-btn:hover {
        background: #c7d2fe;
      }

      .btn-delete {
        padding: 1px 6px;
        flex: 0 0 auto;
        line-height: 1.4;
        background: transparent;
        color: var(--danger);
        border: 1px solid var(--danger);
        border-radius: 4px;
        font-size: 11px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn-delete:hover {
        background: var(--danger);
        color: white;
      }

      .note-title {
        font-weight: 600;
        font-size: 13px;
        color: var(--text-primary);
        flex: 1 1 auto;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .note-url {
        flex: 0 1 auto;
        min-width: 0;
        /* last on the row now that the description has its own line, so it can
           use whatever the date and ids leave behind */
        max-width: 60%;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .note-url a {
        color: var(--primary);
        font-size: 11px;
        text-decoration: none;
        word-break: break-all;
      }

      .note-url a:hover {
        text-decoration: underline;
      }

      .note-desc {
        font-size: 11px;
        color: var(--text-secondary);
        margin-top: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* notes without a description keep the two-line height; the element is
         always emitted so this needs no branching in the render path */
      .note-desc:empty {
        display: none;
      }

      .note-sep {
        display: none;
      }

      .none {
        display: none;
      }

      /* Errors surface here instead of as a permanent line in the layout, so a
         transient failure does not push the note list around. */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        max-width: 92%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        font-size: 12px;
        color: #fff;
        background: var(--danger);
        border-radius: var(--radius);
        box-shadow: var(--shadow-md);
        z-index: 10;
      }

      .toast[hidden] {
        display: none;
      }

      .toast a {
        color: #fff;
        text-decoration: underline;
        white-space: nowrap;
      }

      .toast-close {
        background: transparent;
        border: 0;
        color: #fff;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        padding: 0 2px;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: var(--bg-main);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <div id='save-input'>
      <div class="header">
        <div class="header-left">
          <a href="https://localnative.app" target="_blank">Local Native</a>
          <span class="version" id="version"></span>
        </div>
        <div class="header-options">
          <button class="theme-toggle" id="theme-toggle" title="Toggle theme">🌙</button>
          <label class="checkbox-label">
            <input type="checkbox" id='save-content' name="save-content" value="save-content">
            <span id="label-save-content">Save content</span>
          </label>
          <label class="checkbox-label none">
            <input type="checkbox" id='cb-public' name="public" value="public">
            <span id="label-public">Public</span>
          </label>
          <div class="lang-select">
            <span id="label-language">Language</span>
            <select id='select-language'>
              <option value="en-US">English</option>
              <option value="zh-CN">中文</option>
            </select>
          </div>
        </div>
      </div>
      <div class="input-group">
        <div class="input-row">
          <input class='save-input' id='title' type='text' placeholder='Title'/>
          <input class='save-input' id='url' type='text' placeholder='URL'/>
        </div>
        <input class='save-input' id='desc-text' type='text' placeholder='Description'/>
        <input class='save-input' id='tags-text' type='text' placeholder='Tags (comma or space separated) — Press Enter to save'/>
      </div>
    </div>
    <div class="search-bar">
      <input id='search-text' type='text' placeholder='Search notes...'/>
      <button class="btn btn-clear" id="search-clear-btn" title="Clear search">✕</button>
      <div class="pagination">
        <button class="btn" id="prev-btn">← Prev</button>
        <button class="btn" id="next-btn">Next →</button>
      </div>
      <span id="indicator">0-0 / 0</span>
    </div>
    <div id='notes'></div>
    <div id='toast' class="toast" hidden></div>
  </body>
</html>
