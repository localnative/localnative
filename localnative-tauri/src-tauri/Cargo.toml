[package]
name = "localnative-tauri"
version = "0.5.2"
description = "Local Native desktop app (Tauri + Svelte)"
authors = ["Yi Wang"]
license = "AGPL-3.0"
default-run = "localnative-tauri"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
localnative_core = { path = "../../localnative-rs/localnative_core" }
localnative_hostinstall = { path = "../../localnative-rs/localnative_hostinstall" }
tokio = "1"
dirs = "7"
