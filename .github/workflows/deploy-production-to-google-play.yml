name: Deploy Android to Google Play Alpha

on: workflow_dispatch

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk
      - name: Install Android SDK 36 and NDK
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14033849"
      - name: Assemble Release Bundle
        working-directory: localnative-android
        run: ./gradlew bundleRelease --no-daemon
      - name: Bundle contains the Rust core for all ABIs
        run: |
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -l localnative-android/app/build/outputs/bundle/release/app-release.aab               | grep -q "lib/$abi/liblocalnative_core.so"               || { echo "missing lib/$abi/liblocalnative_core.so"; exit 1; }
          done
          echo "all four ABIs present"
      - name: Sign Release
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: localnative-android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Create service_account.json
        env:
          GOOGLE_PLAY_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_ACCOUNT_JSON }}
        run: echo "$GOOGLE_PLAY_ACCOUNT_JSON" > service_account.json

      - name: Deploy to Alpha
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service_account.json
          packageName: app.localnative
          releaseFiles: localnative-android/app/build/outputs/bundle/release/app-release.aab
          track: alpha
