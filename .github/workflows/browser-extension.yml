name: Browser Extension CI

on:
  push:
    branches: [main, master]
    paths:
      - "localnative-browser-extension/**"
      - ".github/workflows/browser-extension.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "localnative-browser-extension/**"
      - ".github/workflows/browser-extension.yml"

permissions:
  contents: read

jobs:
  lint-popup:
    name: Lint popup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check the popup scripts
        working-directory: localnative-browser-extension/app
        run: |
          node --check popup.js
          node --check popup-i18n.js
          node --check i18n.js
          node --check locales/en-US.js
          node --check locales/zh-CN.js
