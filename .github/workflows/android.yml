name: Android CI

on:
  push:
    branches: [main, master]
    paths:
      - "localnative-android/**"
      - "localnative-rs/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "localnative-android/**"
      - "localnative-rs/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk
      - name: Install Android SDK 36 and NDK
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14033849"
      - name: Build debug APK
        working-directory: localnative-android
        run: ./gradlew assembleDebug --no-daemon
      - name: APK contains the Rust core for all ABIs
        run: |
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -l localnative-android/app/build/outputs/apk/debug/app-debug.apk               | grep -q "lib/$abi/liblocalnative_core.so"               || { echo "missing lib/$abi/liblocalnative_core.so"; exit 1; }
          done
          echo "all four ABIs present"
      - name: Run unit tests
        working-directory: localnative-android
        run: ./gradlew test --no-daemon
